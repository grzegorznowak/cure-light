[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-registry"
version = "0.2.0"
description = "Minimal pilot producer for cure-light PR-text claim chunking"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter==0.26.0",
  "tree-sitter-markdown==0.5.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["claim_registry*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
